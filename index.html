<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Scrollytelling</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300&display=swap"
    rel="stylesheet"
  />

  <style>

    /* ============================================================
       Base
       ============================================================ */

    html,
    body {

      margin: 0;

      min-height: 100%;

      background: #000;

      overflow-x: hidden;

      /*
        The camera position is a direct function of scroll position
        (see main.js) - no JS-side smoothing/catch-up. This just smooths
        the scroll position itself (bounded to wherever you actually
        scrolled, never adds distance on its own).
      */

      scroll-behavior: smooth;

      /* Hide the scrollbar (Firefox / IE-Edge legacy) - scrolling still works. */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }


    /* Hide the scrollbar (Chrome / Safari / other WebKit/Blink browsers) */
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }


    /* ============================================================
       Canvas
       ============================================================ */

    #canvas-container {

      position: fixed;

      inset: 0;

      z-index: 0;

      width: 100vw;
      height: 100vh;
    }


    canvas {

      display: block;

      width: 100%;
      height: 100%;
    }


    /* ============================================================
       Scroll spacer
       ============================================================ */

    #scroll-spacer {

      position: relative;

      z-index: 1;

      /*
        Height is automatically set by JavaScript.
      */
    }


    /* ============================================================
       Loading screen
       ============================================================ */

    #loading {

      position: fixed;

      inset: 0;

      z-index: 2;
    }


    /* Two panels covering the left/right halves of the screen. On
       finish, they slide apart like doors opening to reveal the canvas. */
    .door {

      position: fixed;

      top: 0;

      width: 50%;

      height: 100%;

      background: #000;

      z-index: 2;

      transition:
        transform 1.1s cubic-bezier(0.76, 0, 0.24, 1);
    }


    #door-left {
      left: 0;
    }


    #door-right {
      right: 0;
    }


    #loading.open #door-left {
      transform: translateX(-100%);
    }


    #loading.open #door-right {
      transform: translateX(100%);
    }


    #loading-content {

      position: fixed;

      inset: 0;

      z-index: 3;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 20px;

      color: #fff;

      font:
        14px
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      letter-spacing: 0.08em;

      transition:
        opacity 0.5s ease;
    }


    #loading-logo {

      width: 180px;

      /* logo file is black wordmark on white; invert to show white on
         the black loading background */
      filter: invert(1);
    }


    #loading .bar {

      width: 240px;

      height: 3px;

      background: #333;
    }


    #loading .fill {

      height: 100%;

      width: 0%;

      background: #fff;

      transition:
        width 0.15s linear;
    }


    #loading.open #loading-content {

      opacity: 0;

      pointer-events: none;
    }


    /* ============================================================
       Captions
       ============================================================ */

    /* Timing lives in the data-start / data-duration attributes (Blender
       frame numbers). main.js toggles .visible and feeds --p (0 -> 1 across
       the caption's window) for the scroll-linked 3D drift. */

    #captions {

      position: fixed;

      inset: 0;

      z-index: 1;

      pointer-events: none;

      perspective: 1100px;
    }


    .caption {

      --p: 0;

      /* Hidden until main.js has split the letters and taken over (.ready),
         so a slow or stale-cached script never leaves the raw text showing. */
      visibility: hidden;

      position: absolute;

      top: 0;

      width: 50%;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      transform-style: preserve-3d;
    }


    /* --shift nudges each caption outward from the centre of its half. */
    .caption.ready {
      visibility: visible;
    }


    .caption.left {
      left: 0;
      --tilt: 1;
      --shift: -5vw;
    }


    .caption.right {
      right: 0;
      --tilt: -1;
      --shift: 5vw;
    }


    /* Scroll-linked 3D: turns slowly toward the viewer and drifts upward
       as you scroll through the caption's frames. */
    .caption-body {

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 22px;

      transform-style: preserve-3d;

      transform:
        translate3d(var(--shift), calc((0.5 - var(--p)) * 60px), 0)
        rotateY(calc((0.5 - var(--p)) * 22deg * var(--tilt)))
        rotateX(calc((var(--p) - 0.5) * 8deg));

      will-change: transform;
    }


    /* Idle float, independent of scrolling. */
    .caption-float {

      transform-style: preserve-3d;

      animation: caption-float 7s ease-in-out infinite;
    }


    @keyframes caption-float {

      0%, 100% {
        transform: translate3d(0, -6px, 0) rotateZ(-0.3deg);
      }

      50% {
        transform: translate3d(0, 6px, 20px) rotateZ(0.3deg);
      }
    }


    .caption-text {

      margin: 0;

      font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;

      font-weight: 200;

      font-size: clamp(26px, 4.2vw, 68px);

      line-height: 1;

      letter-spacing: 0.22em;

      /* letter-spacing adds trailing space after the last letter */
      margin-right: -0.22em;

      text-transform: uppercase;

      white-space: nowrap;

      transform-style: preserve-3d;
    }


    .caption.white {
      color: #fff;
    }


    .caption.white .caption-text {
      text-shadow: 0 2px 40px rgba(0, 0, 0, 0.28);
    }


    .caption.black {
      color: #0a0a0a;
    }


    .caption.black .caption-text {
      text-shadow: 0 2px 40px rgba(255, 255, 255, 0.35);
    }


    /* Each letter rises out of a slight tilt and blur, staggered. */
    .caption .char {

      display: inline-block;

      opacity: 0;

      filter: blur(10px);

      transform: translate3d(0, 0.55em, -120px) rotateX(-65deg);

      transform-origin: 50% 100%;

      transition:
        opacity 0.5s ease,
        filter 0.5s ease,
        transform 0.6s cubic-bezier(0.55, 0, 0.9, 0.4);

      transition-delay: calc(var(--i) * 18ms);
    }


    .caption.visible .char {

      opacity: 1;

      filter: blur(0);

      transform: none;

      transition:
        opacity 1.1s ease,
        filter 1.1s ease,
        transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);

      transition-delay: calc(120ms + var(--i) * 55ms);
    }


    .caption .char.space {
      width: 0.35em;
    }


    /* Hairline that draws in under the word. */
    .caption-rule {

      width: 72px;

      height: 1px;

      background: currentColor;

      opacity: 0.8;

      transform: scaleX(0);

      transition: transform 0.5s cubic-bezier(0.55, 0, 0.9, 0.4);
    }


    .caption.visible .caption-rule {

      transform: scaleX(1);

      transition: transform 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.7s;
    }

  </style>

</head>


<body>


  <!-- ============================================================
       Fixed canvas
       ============================================================ -->

  <div id="canvas-container">

    <canvas id="canvas"></canvas>

  </div>


  <!-- ============================================================
       Captions (data-start / data-duration = Blender frame numbers)
       ============================================================ -->

  <div id="captions" aria-live="polite">

    <div class="caption left white" data-start="100" data-duration="150">
      <div class="caption-body">
        <div class="caption-float">
          <h2 class="caption-text">Bag One</h2>
        </div>
        <div class="caption-rule"></div>
      </div>
    </div>

    <div class="caption right black" data-start="600" data-duration="180">
      <div class="caption-body">
        <div class="caption-float">
          <h2 class="caption-text">Bag Two</h2>
        </div>
        <div class="caption-rule"></div>
      </div>
    </div>

  </div>


  <!-- ============================================================
       Loading screen
       ============================================================ -->

  <div id="loading">

    <div id="door-left" class="door"></div>
    <div id="door-right" class="door"></div>

    <div id="loading-content">

      <img
        id="loading-logo"
        src="./Balenciaga-logo.png"
        alt="Balenciaga"
      />

      <div id="loading-text">
        0%
      </div>

      <div class="bar">

        <div
          class="fill"
          id="loading-fill"
        ></div>

      </div>

    </div>

  </div>


  <!-- ============================================================
       Scroll area
       ============================================================ -->

  <div id="scroll-spacer"></div>


  <!-- ============================================================
       Three.js / Spark (gaussian splat renderer)
       ============================================================ -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.2.0/spark.module.js"
    }
  }
  </script>


  <!-- ============================================================
       JavaScript
       ============================================================ -->

  <script
    type="module"
    src="./main.js"
  ></script>


</body>

</html>
